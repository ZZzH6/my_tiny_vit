# 方案B：64 -> 112, patch8 baseline 的长训版。
# 用于和 150 epoch baseline 做公平对比，观察仅增加训练轮数后，
# 112 baseline 主线还能挖出多少精度空间。
#
# 设计原则：
# 1. 结构保持不变；
# 2. 除总 epochs 外，其余 recipe 尽量与 150 epoch baseline 一致；
# 3. 便于直接比较“训练更久”带来的纯收益。
model:
  name: deit_tiny_patch8_112
  num_classes: 200
  pretrained: true
  img_size: 112
  patch_size: 8
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 256
  num_workers: 4
  use_timm_create_transform: true
  use_imagenet_eval: false
  train_interpolation: bicubic
  eval_interpolation: bicubic
  color_jitter: 0.2
  auto_augment: rand-m7-mstd0.5-inc1
  train_crop_scale_min: 0.6
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333
  random_erasing_prob: 0.15
  random_erasing_mode: pixel
  random_erasing_count: 1

train:
  seed: 42
  deterministic: true
  use_timm_scheduler: true
  epochs: 300
  opt: adamw
  opt_eps: 1.0e-8
  lr: 5.0e-4
  scale_lr_by_batch: true
  lr_reference_batch_size: 512
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 0.5
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  sched: cosine
  decay_epochs: 30
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  warmup_epochs: 5
  warmup_lr: 1.0e-6
  min_lr: 1.0e-6
  max_grad_norm: 1.0
  model_ema: true
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  amp: true
  device: cuda
