# 方案B student polish40：基于当前最佳 depth10 + DeiT hard distill student，
# 继续做 40 epoch 低正则尾训，观察 top1 是否还能稳定上升。
#
# 设计原则：
# 1. 结构固定为当前最佳 depth10 distilled student，不再改模型；
# 2. 从已得到的 best checkpoint 初始化，单独验证 low-reg polish 是否有效；
# 3. 为后续 two-stage 单命令复现提供直接依据。
#
# 注意：
# - 本配置保留 DeiT-style hard distillation；
# - 当前 student 主线使用 scale_lr_by_batch=true，batch=256 时：
#   lr=4e-5 的实际峰值学习率等效约 2e-5。
#
# 运行方式：
#   python -u scripts/train.py \
#     --config configs/deit_tiny_patch8_112_student_depth10_deit_harddistill_polish40.yaml
model:
  name: deit_tiny_patch8_112
  num_classes: 200
  pretrained: true
  distilled: true
  img_size: 112
  patch_size: 8
  depth: 10
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 256
  num_workers: 4
  multiprocessing_context: spawn
  inherit_parent_affinity: true
  use_timm_create_transform: true
  use_imagenet_eval: false
  train_interpolation: bicubic
  eval_interpolation: bicubic
  color_jitter: 0.1
  auto_augment: null
  train_crop_scale_min: 0.9
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.95
  train_crop_ratio_max: 1.05
  random_erasing_prob: 0.0
  random_erasing_mode: pixel
  random_erasing_count: 1

train:
  seed: 42
  deterministic: true
  use_timm_scheduler: true
  epochs: 40
  opt: adamw
  opt_eps: 1.0e-8
  lr: 4.0e-5
  scale_lr_by_batch: true
  lr_reference_batch_size: 512
  weight_decay: 0.05
  label_smoothing: 0.0
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  mixup_prob: 0.0
  mixup_switch_prob: 0.0
  sched: cosine
  decay_epochs: 30
  cooldown_epochs: 0
  patience_epochs: 10
  decay_rate: 0.1
  warmup_epochs: 0
  warmup_lr: 1.0e-6
  min_lr: 1.0e-6
  init_checkpoint: results/checkpoints/20260424/deit_tiny_patch8_112_student_depth10_deit_harddistill_same_recipe_20260424_133243_best.pt
  distillation:
    enabled: true
    method: deit
    type: hard
    teacher_checkpoint: results/checkpoints/20260422/deit_tiny_patch8_112_overlap_patch12_strong_teacher_polish40_20260422_171852_best.pt
    alpha: 0.4
    temperature: 1.0
  max_grad_norm: null
  model_ema: true
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  amp: true
  device: cuda
