model:
  name: deit_tiny
  num_classes: 200
  pretrained: true
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 224
  batch_size: 256
  num_workers: 4
  train_crop_padding: 4
  randaugment_num_ops: 2
  randaugment_magnitude: 9
  random_erasing_prob: 0.25

train:
  seed: 42
  deterministic: true
  epochs: 50
  lr: 5.0e-4
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  warmup_epochs: 5
  min_lr: 1.0e-6
  early_stop_patience: 10
  max_grad_norm: 1.0
  amp: true
  device: cuda
