# 方案A：标准 DeiT-Tiny baseline。保留 timm 强 recipe，作为论文主锚点；
# 验证阶段与当前 112 主线统一使用 direct resize，便于逐步比较优化是否有效。
model:
  name: deit_tiny
  num_classes: 200
  pretrained: true
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 224
  batch_size: 512
  num_workers: 8
  multiprocessing_context: spawn
  inherit_parent_affinity: true
  use_timm_create_transform: true
  use_imagenet_eval: false
  repeated_aug: true
  repeated_aug_repeats: 3
  train_interpolation: bicubic
  eval_interpolation: bicubic
  eval_crop_ratio: 0.875
  color_jitter: 0.3
  auto_augment: rand-m9-mstd0.5-inc1
  train_crop_scale_min: 0.08
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333
  random_erasing_prob: 0.25
  random_erasing_mode: pixel
  random_erasing_count: 1

train:
  seed: 42
  deterministic: true
  use_timm_scheduler: true
  epochs: 300
  opt: adamw
  opt_eps: 1.0e-8
  lr: 5.0e-4
  scale_lr_by_batch: true
  lr_reference_batch_size: 512
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  sched: cosine
  decay_epochs: 30
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  warmup_epochs: 5
  warmup_lr: 1.0e-6
  min_lr: 1.0e-5
  max_grad_norm: null
  model_ema: true
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  amp: true
  device: cuda
