model:
  name: deit_tiny_patch8_112_prepatch_localffn
  num_classes: 200
  pretrained: false
  img_size: 112
  patch_size: 8
  drop_path_rate: 0.05
  drop_rate: 0.0
  attn_drop_rate: 0.0
  local_ffn_blocks: [8, 9, 10, 11]
  local_ffn_kernel_size: 3
  pre_patch_local: true
  pre_patch_hidden_channels: 24
  pre_patch_kernel_size: 3

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 512
  num_workers: 8
  train_crop_scale_min: 0.9
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.95
  train_crop_ratio_max: 1.05

  # 基于稍强 recipe 的 best checkpoint 做低学习率 tail 分析，不改原 recipe。
  randaugment_num_ops: 2
  randaugment_magnitude: 7
  random_erasing_prob: 0.10

train:
  seed: 42
  deterministic: true
  epochs: 15
  lr: 2.0e-6
  weight_decay: 0.05
  label_smoothing: 0.05

  mixup_alpha: 0.15
  cutmix_alpha: 0.4
  mixup_prob: 1.0
  mixup_switch_prob: 0.2

  warmup_epochs: 0
  min_lr: 5.0e-7
  max_grad_norm: 1.0
  amp: true
  device: cuda
  init_checkpoint: results/checkpoints/20260417/deit_tiny_patch8_112_prepatch_localffn_tuned_v1_50ep_copy_20260417_182937_best.pt
