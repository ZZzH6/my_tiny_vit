# 方案B teacher 强化版：保留当前最有效的 overlap patch12 结构，
# 只增强训练 recipe，目标是在不再引入额外局部模块的前提下冲击 80%。
#
# 设计原则：
# 1. 结构只保留已验证有效的 overlap patch embedding；
# 2. 训练侧补上更接近 DeiT 强 recipe 的 repeated aug / 更强 AA / 更高 RE；
# 3. 保持 112 teacher 主线与后续 112 student 蒸馏兼容。
model:
  name: deit_tiny_patch8_112
  num_classes: 200
  pretrained: true
  img_size: 112
  patch_size: 8
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0
  overlap_patch_embed: true
  overlap_patch_kernel_size: 12
  overlap_patch_interpolation: bicubic

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 256
  num_workers: 4
  use_timm_create_transform: true
  use_imagenet_eval: false
  repeated_aug: true
  repeated_aug_repeats: 3
  train_interpolation: bicubic
  eval_interpolation: bicubic
  color_jitter: 0.25
  auto_augment: rand-m8-mstd0.5-inc1
  train_crop_scale_min: 0.6
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333
  random_erasing_prob: 0.20
  random_erasing_mode: pixel
  random_erasing_count: 1

train:
  seed: 42
  deterministic: true
  use_timm_scheduler: true
  epochs: 150
  opt: adamw
  opt_eps: 1.0e-8
  lr: 5.0e-4
  scale_lr_by_batch: true
  lr_reference_batch_size: 512
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.3
  cutmix_alpha: 0.5
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  sched: cosine
  decay_epochs: 30
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  warmup_epochs: 5
  warmup_lr: 1.0e-6
  min_lr: 1.0e-6
  max_grad_norm: null
  model_ema: true
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  amp: true
  device: cuda
