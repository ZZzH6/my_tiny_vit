# 方案B 最终 teacher 单命令复现版：
# 将完整训练 + 低正则尾训合并到一次训练流程中。
#
# 设计原则：
# 1. 结构固定为当前最有效的 overlap patch12，不再引入额外局部模块；
# 2. 阶段1使用 strong teacher recipe 学泛化表征；
# 3. 阶段2自动切到 low-regularization refinement，把 top5 排序能力转成更稳的 top1；
# 4. 单条命令即可复现完整 teacher 训练流程，避免先训再手动尾训的额外操作。
#
# 运行方式：
#   python -u scripts/train.py \
#     --config configs/deit_tiny_patch8_112_overlap_patch12_teacher_twostage.yaml
model:
  name: deit_tiny_patch8_112
  num_classes: 200
  pretrained: true
  img_size: 112
  patch_size: 8
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0
  overlap_patch_embed: true
  overlap_patch_kernel_size: 12
  overlap_patch_interpolation: bicubic

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 256
  num_workers: 4
  use_timm_create_transform: true
  use_imagenet_eval: true
  repeated_aug: true
  repeated_aug_repeats: 3
  train_interpolation: bicubic
  eval_interpolation: bicubic
  color_jitter: 0.25
  auto_augment: rand-m8-mstd0.5-inc1
  train_crop_scale_min: 0.6
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333
  random_erasing_prob: 0.20
  random_erasing_mode: pixel
  random_erasing_count: 1

train:
  seed: 42
  deterministic: true
  use_timm_scheduler: false
  epochs: 190
  opt: adamw
  opt_eps: 1.0e-8
  lr: 2.5e-4
  scale_lr_by_batch: false
  lr_reference_batch_size: 512
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.3
  cutmix_alpha: 0.5
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  sched: cosine
  decay_epochs: 30
  cooldown_epochs: 0
  patience_epochs: 10
  decay_rate: 0.1
  warmup_epochs: 5
  warmup_lr: 1.0e-6
  min_lr: 1.0e-6
  max_grad_norm: null
  model_ema: true
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  amp: true
  device: cuda
  stages:
    - name: strong_main
      epochs: 150
      lr: 2.5e-4
      warmup_epochs: 5
      warmup_lr: 1.0e-6
      min_lr: 1.0e-6
      train_overrides:
        use_timm_scheduler: true
        cooldown_epochs: 10
    - name: low_reg_refine
      epochs: 40
      lr: 2.0e-5
      warmup_epochs: 0
      warmup_lr: 1.0e-6
      min_lr: 1.0e-6
      load_best_from_previous_stage: true
      reset_optimizer: true
      reset_scaler: true
      data_overrides:
        repeated_aug: false
        color_jitter: 0.1
        auto_augment: null
        train_crop_scale_min: 0.9
        train_crop_scale_max: 1.0
        train_crop_ratio_min: 0.95
        train_crop_ratio_max: 1.05
        random_erasing_prob: 0.0
      train_overrides:
        use_timm_scheduler: true
        label_smoothing: 0.0
        mixup_alpha: 0.0
        cutmix_alpha: 0.0
        mixup_prob: 0.0
        mixup_switch_prob: 0.0
        max_grad_norm: null
