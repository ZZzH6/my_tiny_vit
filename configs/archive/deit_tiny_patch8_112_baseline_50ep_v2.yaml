model:
  name: deit_tiny_patch8_112
  num_classes: 200
  pretrained: true
  img_size: 112
  patch_size: 8
  drop_path_rate: 0.05
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 512
  num_workers: 8
  train_crop_scale_min: 0.9
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.95
  train_crop_ratio_max: 1.05

  # patch8_112 的 v2 对照 recipe：
  # 与 prepatch+localffn 版本完全同配方，只去掉结构增强。
  randaugment_num_ops: 2
  randaugment_magnitude: 7
  random_erasing_prob: 0.10

train:
  seed: 42
  deterministic: true
  epochs: 50
  lr: 7.5e-4
  weight_decay: 0.05
  label_smoothing: 0.05

  mixup_alpha: 0.15
  cutmix_alpha: 0.4
  mixup_prob: 1.0
  mixup_switch_prob: 0.2

  warmup_epochs: 5
  min_lr: 1.0e-6
  max_grad_norm: 1.0
  amp: true
  device: cuda
