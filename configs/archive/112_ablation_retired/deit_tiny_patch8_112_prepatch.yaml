# 方案B：64 -> 112, patch8 + PrePatch image-space local adapter。
# 训练 recipe 与 deit_tiny_patch8_112_baseline 保持一致，只保留前端模块变量。
model:
  name: deit_tiny_patch8_112
  num_classes: 200
  pretrained: true
  img_size: 112
  patch_size: 8
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0
  pre_patch_local: true
  pre_patch_hidden_channels: 24
  pre_patch_kernel_size: 3

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 256
  num_workers: 4
  use_timm_create_transform: true
  use_imagenet_eval: false
  train_interpolation: bicubic
  eval_interpolation: bicubic
  color_jitter: 0.2
  auto_augment: rand-m7-mstd0.5-inc1
  train_crop_scale_min: 0.6
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333
  random_erasing_prob: 0.15
  random_erasing_mode: pixel
  random_erasing_count: 1

train:
  seed: 42
  deterministic: true
  use_timm_scheduler: true
  epochs: 150
  opt: adamw
  opt_eps: 1.0e-8
  lr: 5.0e-4
  scale_lr_by_batch: true
  lr_reference_batch_size: 512
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 0.5
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  sched: cosine
  decay_epochs: 30
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  warmup_epochs: 5
  warmup_lr: 1.0e-6
  min_lr: 1.0e-6
  max_grad_norm: 1.0
  model_ema: true
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  amp: true
  device: cuda
