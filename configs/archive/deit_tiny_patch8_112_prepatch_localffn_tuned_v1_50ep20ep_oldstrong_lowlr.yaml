model:
  name: deit_tiny_patch8_112_prepatch_localffn
  num_classes: 200
  pretrained: true
  img_size: 112
  patch_size: 8
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0
  local_ffn_blocks: [8, 9, 10, 11]
  local_ffn_kernel_size: 3
  pre_patch_local: true
  pre_patch_hidden_channels: 24
  pre_patch_kernel_size: 3

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 256
  num_workers: 4
  train_crop_scale_min: 0.6
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333

  # 64 -> 112 扩展实验：保持 prepatch + localffn 结构不变，
  # 主训练阶段复刻 old strong baseline 的强正则 recipe，
  # 再接 20 轮更低学习率收尾，验证强正则是否能进一步提升泛化。
  randaugment_num_ops: 2
  randaugment_magnitude: 9
  random_erasing_prob: 0.25

train:
  seed: 42
  deterministic: true
  epochs: 70
  lr: 5.0e-4
  weight_decay: 0.05
  label_smoothing: 0.1

  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_prob: 1.0
  mixup_switch_prob: 0.5

  warmup_epochs: 5
  min_lr: 1.0e-6
  stages:
    - name: main_oldstrong
      epochs: 50
      lr: 5.0e-4
      warmup_epochs: 5
      min_lr: 1.0e-6
    - name: tail_lowlr
      epochs: 20
      lr: 1.0e-6
      warmup_epochs: 0
      min_lr: 1.0e-7
  max_grad_norm: 1.0
  amp: true
  device: cuda
