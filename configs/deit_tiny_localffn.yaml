model:
  name: deit_tiny_localffn
  num_classes: 200
  pretrained: true
  img_size: 224
  patch_size: 16
  drop_path_rate: 0.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  local_ffn_blocks: [8, 9, 10, 11]
  local_ffn_kernel_size: 3

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 224
  batch_size: 512
  num_workers: 8
  train_crop_scale_min: 0.6
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333
  randaugment_num_ops: 2
  randaugment_magnitude: 9
  random_erasing_prob: 0.25

train:
  seed: 42
  deterministic: true
  epochs: 50
  lr: 1.0e-3
  weight_decay: 0.05
  label_smoothing: 0.0
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  warmup_epochs: 5
  min_lr: 1.0e-6
  max_grad_norm: 1.0
  amp: true
  device: cuda
