# 方案B 最终 student 单命令复现版：
# 将 depth10 + DeiT hard distill 主训练与 low-reg polish40 合并到一次训练流程中。
#
# 设计原则：
# 1. 阶段1完整复现当前最佳 depth10 hard-distill student 主训练；
# 2. 阶段2自动切到低正则 refinement，验证并复现 polish40 的额外收益；
# 3. 单条命令即可从头复现完整 student 训练流程。
#
# 注意：
# - 当前 student 主线保留 scale_lr_by_batch=true；
# - 在 batch=256 时，阶段1 lr=5e-4 等效约 2.5e-4，
#   阶段2 lr=4e-5 等效约 2e-5。
#
# 运行方式：
#   python -u scripts/train.py \
#     --config configs/deit_tiny_patch8_112_student_depth10_deit_harddistill_twostage.yaml
model:
  name: deit_tiny_patch8_112
  num_classes: 200
  pretrained: true
  distilled: true
  img_size: 112
  patch_size: 8
  depth: 10
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 256
  num_workers: 4
  multiprocessing_context: spawn
  inherit_parent_affinity: true
  use_timm_create_transform: true
  use_imagenet_eval: false
  train_interpolation: bicubic
  eval_interpolation: bicubic
  color_jitter: 0.2
  auto_augment: rand-m7-mstd0.5-inc1
  train_crop_scale_min: 0.6
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333
  random_erasing_prob: 0.15
  random_erasing_mode: pixel
  random_erasing_count: 1

train:
  seed: 42
  deterministic: true
  use_timm_scheduler: false
  epochs: 190
  opt: adamw
  opt_eps: 1.0e-8
  lr: 5.0e-4
  scale_lr_by_batch: true
  lr_reference_batch_size: 512
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 0.5
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  sched: cosine
  decay_epochs: 30
  cooldown_epochs: 0
  patience_epochs: 10
  decay_rate: 0.1
  warmup_epochs: 5
  warmup_lr: 1.0e-6
  min_lr: 1.0e-6
  distillation:
    enabled: true
    method: deit
    type: hard
    teacher_checkpoint: results/checkpoints/20260422/deit_tiny_patch8_112_overlap_patch12_strong_teacher_polish40_20260422_171852_best.pt
    alpha: 0.4
    temperature: 1.0
  max_grad_norm: 1.0
  model_ema: true
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  amp: true
  device: cuda
  stages:
    - name: harddistill_main
      epochs: 150
      lr: 5.0e-4
      warmup_epochs: 5
      warmup_lr: 1.0e-6
      min_lr: 1.0e-6
      train_overrides:
        use_timm_scheduler: true
        cooldown_epochs: 10
    - name: low_reg_refine
      epochs: 40
      lr: 4.0e-5
      warmup_epochs: 0
      warmup_lr: 1.0e-6
      min_lr: 1.0e-6
      load_best_from_previous_stage: true
      reset_optimizer: true
      reset_scaler: true
      data_overrides:
        color_jitter: 0.1
        auto_augment: null
        train_crop_scale_min: 0.9
        train_crop_scale_max: 1.0
        train_crop_ratio_min: 0.95
        train_crop_ratio_max: 1.05
        random_erasing_prob: 0.0
      train_overrides:
        use_timm_scheduler: true
        label_smoothing: 0.0
        mixup_alpha: 0.0
        cutmix_alpha: 0.0
        mixup_prob: 0.0
        mixup_switch_prob: 0.0
        max_grad_norm: null
