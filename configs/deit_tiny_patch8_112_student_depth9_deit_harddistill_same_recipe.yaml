# 方案B student depth9：保持 depth9 轻量化结构不变，
# 将蒸馏方式从 logit soft KD 切换为当前表现更好的 DeiT-style hard distillation。
#
# 单变量目的：
# 1. 判断 depth9 的明显掉点主要来自深度压缩，还是来自蒸馏方式不适配；
# 2. 与 depth9 logit soft KD 做公平对照，teacher 与训练 recipe 均保持一致；
# 3. 若精度能明显回升，则 depth9 仍可作为更轻 student 候选。
#
# 预期复杂度：
# - Params: 约 4.16M
# - FLOPs : 约 1.59G（thop, FLOPs=2xMACs）
#
# 运行方式：
#   python -u scripts/train.py \
#     --config configs/deit_tiny_patch8_112_student_depth9_deit_harddistill_same_recipe.yaml
model:
  name: deit_tiny_patch8_112
  num_classes: 200
  pretrained: true
  distilled: true
  img_size: 112
  patch_size: 8
  depth: 9
  drop_path_rate: 0.1
  drop_rate: 0.0
  attn_drop_rate: 0.0

data:
  dataset: tiny_imagenet
  root: dataset/tiny-imagenet-200
  img_size: 112
  batch_size: 256
  num_workers: 4
  multiprocessing_context: spawn
  inherit_parent_affinity: true
  use_timm_create_transform: true
  use_imagenet_eval: false
  train_interpolation: bicubic
  eval_interpolation: bicubic
  color_jitter: 0.2
  auto_augment: rand-m7-mstd0.5-inc1
  train_crop_scale_min: 0.6
  train_crop_scale_max: 1.0
  train_crop_ratio_min: 0.75
  train_crop_ratio_max: 1.3333333333333333
  random_erasing_prob: 0.15
  random_erasing_mode: pixel
  random_erasing_count: 1

train:
  seed: 42
  deterministic: true
  use_timm_scheduler: true
  epochs: 150
  opt: adamw
  opt_eps: 1.0e-8
  lr: 5.0e-4
  scale_lr_by_batch: true
  lr_reference_batch_size: 512
  weight_decay: 0.05
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 0.5
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  sched: cosine
  decay_epochs: 30
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  warmup_epochs: 5
  warmup_lr: 1.0e-6
  min_lr: 1.0e-6
  distillation:
    enabled: true
    method: deit
    type: hard
    teacher_checkpoint: results/checkpoints/20260422/deit_tiny_patch8_112_overlap_patch12_strong_teacher_polish40_20260422_171852_best.pt
    alpha: 0.4
    temperature: 1.0
  max_grad_norm: 1.0
  model_ema: true
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  amp: true
  device: cuda
